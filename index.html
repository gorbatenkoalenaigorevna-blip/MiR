<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#eebc83">
  <title>МИР — маленькие исследователи речи</title>
  <link rel="stylesheet" href="site.css">
  <link rel="stylesheet" href="station-stories.css?v=20260809-location-messages">
  <link rel="stylesheet" href="station-markers.css">
  <link rel="stylesheet" href="yashka-landscape.css">
  <link rel="stylesheet" href="map-cover.css">
  <link rel="stylesheet" href="profile-rating.css">
  <link rel="stylesheet" href="house-profile.css">
  <link rel="stylesheet" href="registration-create.css">
  <link rel="stylesheet" href="rating-layout.css?v=20260809-shared-profile-avatar">
</head>
<body>
  <main class="site-shell" aria-labelledby="siteTitle">
    <h1 id="siteTitle" class="visually-hidden">МИР: маленькие исследователи речи</h1>
    <div class="ambient-map" aria-hidden="true"></div>

    <header class="topbar">
      <a class="site-logo-link" href="https://vk.ru/aigo_logo" target="_blank" rel="noopener noreferrer" aria-label="Открыть группу МИР во ВКонтакте"><img class="site-logo" src="MIR_SITE_VISUAL_ONLY/brand/mir-logo-transparent.png" alt="МИР — маленькие исследователи речи"></a>
      <nav class="topnav" aria-label="Навигация по сайту">
        <span class="topnav-current">Карта мира</span>
        <span class="topnav-count">3 игры</span>
        <button id="siteSound" class="sound" type="button" aria-label="Выключить звуки" aria-pressed="false">♪</button>
        <button id="profileButton" class="profile-chip" type="button" aria-label="Открыть профиль исследователя" hidden><img id="profileChipAvatar" src="" alt=""><span id="profileChipName"></span><span class="spark-count"><img src="assets/profile/ui/speech-spark.png" alt="Искры речи"><b id="profileChipSparks">0</b></span></button>
        <button id="ratingButton" class="rating-open" type="button" aria-label="Открыть Созвездие исследователей"><img src="assets/profile/ui/rating-button.png" alt=""></button>
      </nav>
    </header>

    <section class="map-stage" aria-label="Карта игрового мира">
      <div class="map-content">
        <img class="world-map" src="MIR_SITE_VISUAL_ONLY/map/mir-world-map-approved.png" alt="Сказочная карта с лесом, рекой, мостом и вулканом">

      <button class="station story-station marker-station kindergarten-station" type="button" data-station="kindergarten" aria-label="Открыть Домик исследователя"><img src="assets/ui/station-markers/01-kindergarten.png" alt=""><span class="marker-label">Домик исследователя</span></button>
      <button class="station story-station marker-station forest-station" type="button" data-station="forest" aria-label="Открыть станцию «Лес звуков»"><img src="assets/ui/station-markers/02-forest-path.png" alt=""><span class="marker-label">Лес звуков</span></button>
      <button class="station story-station marker-station meadow-station" type="button" data-station="meadow" aria-label="Открыть станцию «Цветочная поляна»"><img src="assets/ui/station-markers/03-flower-meadow.png" alt=""><span class="marker-label">Цветочная поляна</span></button>
      <button class="station story-station marker-station cliff-station" type="button" data-station="cliff" aria-label="Открыть станцию «Скала артикуляции»"><img src="assets/ui/station-markers/04-articulation-cliff.png" alt=""><span class="marker-label">Скала артикуляции</span></button>
      <button class="station story-station marker-station bridge-station" type="button" data-station="bridge" aria-label="Открыть станцию «Волшебный мостик»"><img src="assets/ui/station-markers/05-magic-bridge.png" alt=""><span class="marker-label">Волшебный мостик</span></button>
      <button class="station story-station marker-station volcano-station" type="button" data-station="volcano" aria-label="Открыть станцию «Говорящий вулкан»"><img src="assets/ui/station-markers/06-talking-volcano.png" alt=""><span class="marker-label">Говорящий вулкан</span></button>
      <button class="station story-station marker-station river-station" type="button" data-station="river" aria-label="Открыть станцию «Речка слов»"><img src="assets/ui/station-markers/07-river-of-words.png" alt=""><span class="marker-label">Речка слов</span></button>
        <button class="station story-station marker-station sea-station" type="button" data-station="sea" aria-label="Открыть станцию «Море предложений»"><img src="assets/ui/station-markers/08-sea-of-sentences.png" alt=""><span class="marker-label">Море предложений</span></button>

        <aside class="yashka-helper" aria-label="Яшка приглашает выбрать станцию">
          <span class="helper-copy"><strong>Привет!</strong><small>Выбирай станцию</small></span>
          <img src="MIR_SITE_VISUAL_ONLY/character/yashka-site-hero.png" alt="Яшка">
        </aside>
      </div>
    </section>
    <footer>МИР · играем с речью</footer>

    <div id="profileGate" class="profile-overlay" hidden><section class="profile-panel gate-panel" role="dialog" aria-modal="true" aria-labelledby="gateTitle"><div id="createView" class="panel-scroll create-view"><h2 id="gateTitle">Создай исследователя</h2><p>Выбери зверька и придумай игровой ник</p><label class="nick-label">Игровой ник<input id="profileNick" type="text" maxlength="18" autocomplete="off" placeholder="Например, Звонкий Лис"></label><div id="avatarPicker" class="avatar-picker" role="radiogroup" aria-label="Выбери аватар"></div><p id="createError" class="form-error" role="alert"></p><button id="createProfile" class="profile-primary" type="button">СОЗДАТЬ ИССЛЕДОВАТЕЛЯ</button><button id="backToProfiles" class="profile-secondary" type="button" hidden>Назад к профилям</button></div><div id="chooseView" class="panel-scroll choose-view" hidden><h2>Кто сегодня исследует МИР?</h2><div id="profileChoices" class="profile-choices"></div><button id="addProfile" class="profile-primary" type="button">ДОБАВИТЬ ИССЛЕДОВАТЕЛЯ</button></div></section></div>
    <div id="profileModal" class="profile-overlay" hidden><div class="profile-shade" data-close-profile></div><section class="profile-panel profile-details" role="dialog" aria-modal="true" aria-labelledby="profileTitle"><button class="panel-close" type="button" data-close-profile aria-label="Закрыть профиль">×</button><div id="profileContent" class="panel-scroll"></div></section></div>
    <div id="ratingModal" class="profile-overlay" hidden><div class="profile-shade" data-close-rating></div><section class="rating-panel" role="dialog" aria-modal="true" aria-labelledby="ratingTitle"><button class="panel-close" type="button" data-close-rating aria-label="Закрыть рейтинг">×</button><div class="rating-content"><h2 id="ratingTitle">Созвездие исследователей</h2><div class="rating-tabs" role="tablist"><button id="myTab" type="button" role="tab" aria-selected="true">Мои успехи</button><button id="allTab" type="button" role="tab" aria-selected="false">Исследователи МИРа</button></div><div id="ratingBody" class="rating-body"></div></div></section></div>

    <div id="storyModal" class="story-modal" hidden>
      <div class="story-backdrop" data-close-story></div>
      <article class="story-card" role="dialog" aria-modal="true" aria-labelledby="storyTitle" aria-describedby="storyText">
        <img id="storyImage" class="story-image" src="" alt="">
        <button id="storyClose" class="story-close" type="button" aria-label="Закрыть окно">×</button>
        <div class="story-panel">
          <div class="story-copy"><small id="storyStage"></small><h2 id="storyTitle"></h2><p id="storyText"></p></div>
          <a id="storyAction" class="story-action" href="#">Продолжить</a>
        </div>
      </article>
    </div>
  </main>
  <script src="mir-progress.js?v=20260809-profile-delete"></script>
  <script src="site.js?v=20260809-articulation-cliff-game"></script>
  <script src="profile-rating.js?v=20260809-shared-profile-avatar"></script>
</body>
</html>
