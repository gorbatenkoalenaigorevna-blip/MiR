<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#775c91"><title>Скала артикуляции — МИР</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="../games-ui.css"></head><body>
<main class="ac-game"><section id="acScene" class="ac-scene" aria-live="polite">
  <header class="unified-hud ac-unified-hud" aria-label="Общая игровая панель МИР"><button id="cliffSound" class="hud-tool" type="button" aria-label="Выключить игровые звуки" aria-pressed="false">♫</button><div id="cliffScreenStatus" class="hud-progress">Скала артикуляции</div><div class="hud-score">Общий счёт: <span id="cliffTotalScore">0</span></div><a class="hud-tool ac-world-tool" href="../index.html" aria-label="Вернуться на карту МИР">←</a></header>
  <section id="titleScreen" class="ac-screen active"><img class="ac-bg" src="../assets/games/articulation-cliff/backgrounds/articulation-cliff-title.png" alt="Скала артикуляции и Яшка"><div class="ac-card ac-title-card"><h1>Скала артикуляции</h1><p>Найди парные знаки и зажги кристаллы!</p><div><button id="playButton" type="button">Играть</button></div></div></section>
  <section id="gameScreen" class="ac-screen"><img class="ac-bg ac-gameplay-bg" src="../assets/games/articulation-cliff/backgrounds/articulation-cliff-gameplay.png" alt="Скала с местами для двенадцати карточек"><div class="ac-magic-haze" aria-hidden="true"></div><header class="ac-progress"><span>Кристаллы:</span><strong id="progressText">0/6</strong><div id="progressCrystals" aria-label="Зажжено кристаллов: 0 из 6"></div></header><div id="memoryGrid" class="ac-memory-grid" aria-label="Карточки упражнений"></div><div id="matchBeam" class="ac-match-beam" aria-hidden="true"></div><output id="scorePop" class="ac-score-pop" hidden>+1</output></section>
  <section id="finalScreen" class="ac-screen"><img class="ac-bg" src="../assets/games/articulation-cliff/backgrounds/articulation-cliff-finale.png" alt="Зажжённая Скала артикуляции и Яшка"><div class="ac-card ac-final-card"><h1>Скала засияла!</h1><p>Ты нашёл все парные знаки, выполнил 6 упражнений и получил 6 баллов.</p><div><button id="replayButton" type="button">Сыграть ещё раз</button></div></div></section>
  <div id="exerciseModal" class="ac-modal" hidden><section class="ac-exercise" role="dialog" aria-modal="true" aria-labelledby="exerciseTitle"><img class="ac-instruction-art" src="../assets/games/articulation-cliff/yashka-instruction-window.png" alt=""><div class="ac-exercise-copy"><h2 id="exerciseTitle"></h2><p id="exerciseText"></p></div><div class="ac-exercise-action"><div class="ac-timer" aria-label="Кристалл упражнения"><img src="../assets/games/articulation-cliff/timer/crystal-empty.png" alt=""><span id="crystalFill"><img src="../assets/games/articulation-cliff/timer/crystal-full.png" alt=""></span></div><p id="timerText" class="ac-timer-text">10 секунд</p><button id="igniteButton" type="button">Зажечь кристалл</button></div><div id="lightParticles" class="ac-light-particles" aria-hidden="true"></div></section></div>
</section></main><script src="../mir-progress.js?v=20260809-cliff"></script><script src="game.js"></script></body></html>
